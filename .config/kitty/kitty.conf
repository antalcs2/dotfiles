# BEGIN_KITTY_THEME
# Gruvbox Dark Soft
include current-theme.conf
# END_KITTY_THEME



# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size		 9
disable_ligatures cursor

# Cursors
cursor_shape beam
cursor_blink_interval -1

# Mouse
default_pointer_shape beam

# Performance
input_delay 1
sync_to_monitor no

# Window layout
remember_window_size  yes
initial_window_width  1024
initial_window_height 400
window_border_width 1
hide_window_decorations no
resize_debounce_time 0.05 0.05
confirm_os_window_close 0

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_title_template "{num_windows} window{'s' if num_windows > 1 else ''} opened"

# Advanced
allow_remote_control yes
termguicolors yes

# Keyboard shortcuts
clear_all_shortcuts yes
map alt+c copy_to_clipboard
map alt+v paste_from_clipboard

map alt+w new_window
map alt+e close_window
map alt+[ next_window
map alt+] previous_window
map alt+r start_resizing_window

map alt+t new_tab
map alt+q close_tab
map alt+. next_tab
map alt+, previous_tab
map alt+right move_tab_forward
map alt+left move_tab_backward
map alt+n set_tab_title

map alt+p next_layout
map alt+kp_add change_font_size all +1.0
map alt+= change_font_size all +0.5
map alt+kp_subtract change_font_size all -1.0
map alt+- change_font_size all -0.5
map alt+backspace change_font_size all 0
